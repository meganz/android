# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx10248m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.injected.testOnly=false
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=android-base-common,common
# nonFinalResIds & nonTransitiveRClass will be true by default for gradle 8.0
android.nonFinalResIds=true
android.nonTransitiveRClass=true

# Run tasks from different modules in parallel (module-level parallelism; test forks are
# configured separately in build-logic AndroidTest.kt).
org.gradle.parallel=true

# Build tooling models in parallel during IDE sync (Gradle 9.4 or later). Redundant today:
# it defaults to org.gradle.parallel above; set explicitly so sync stays parallel if Gradle
# decouples that default.
org.gradle.tooling.parallel=true

# gradle configuration cache
#org.gradle.unsafe.configuration-cache=true
## Use this flag carefully, in case some of the plugins are not fully compatible.
#org.gradle.unsafe.configuration-cache-problems=warn

org.gradle.caching=true
android.enableR8.fullMode=true
android.experimental.enableScreenshotTest=true

# AGP 9 flipped defaults to false; app + data modules still use resValue().
android.defaults.buildfeatures.resvalues=true
# Restore AGP 8.13 behavior: propagate dependency constraints between configurations
# so transitive deps (e.g. androidx.hilt:hilt-navigation pulling navigation 2.5.1)
# don't override the project's pinned versions.
android.dependency.useConstraints=true
# AGP 9 flipped this to true, which only generates unit-test variants for the
# tested build type (default: debug). That hides testGmsQaUnitTest from Gradle
# and breaks Android Studio test gutter icons when the active variant is gmsQa.
android.onlyEnableUnitTestForTheTestedBuildType=false

systemProp.http.keepAlive=true
systemProp.http.maxConnections=16
